<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seoul Travel Guide</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1.5em 0;
            font-size: 1.5em;
        }
        .content {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        .search-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        #search-input {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
        }
        .search-container button {
            padding: 10px 15px;
            border: none;
            background-color: #4CAF50;
            color: white;
            font-size: 1em;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
        }
        #map {
            height: 500px;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .photo-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .photo-container img {
            width: 120px;
            height: auto;
            margin: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .photo-container img:hover {
            transform: scale(1.2);
        }
        .place-info {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <header>
        <h1>Seoul Travel Guide</h1>
    </header>

    <div class="content">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Enter a place to search" value="박물관">
            <button onclick="searchPlaces()">Search Museums</button>
        </div>
        <div id="map"></div>
        
        <!-- 박물관 정보 표시 영역 -->
        <div id="place-info" class="place-info"></div>

        <!-- 사진 표시용 컨테이너 추가 -->
        <div id="photo-container" class="photo-container"></div>
    </div>

    <script>
        let map;
        let markers = [];
        const seoul = { lat: 37.5665, lng: 126.978 };
        const flickrAPIKey = '1af73998f0c634c06f6568e1bf752649';

        function initMap() {
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: seoul,
            });
        }

        function searchPlaces() {
            const query = document.getElementById("search-input").value;
            const service = new google.maps.places.PlacesService(map);

            markers.forEach(marker => marker.setMap(null));
            markers = [];

            const request = {
                location: seoul,
                radius: 10000,
                query: query,
            };

            service.textSearch(request, (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK) {
                    results.forEach(place => {
                        const marker = new google.maps.Marker({
                            map: map,
                            position: place.geometry.location,
                            title: place.name,
                        });

                        marker.addListener("click", () => {
                            showPlaceInfo(place);
                            fetchFlickrPhotos(place.name);
                        });

                        markers.push(marker);
                    });

                    const bounds = new google.maps.LatLngBounds();
                    markers.forEach(marker => bounds.extend(marker.getPosition()));
                    map.fitBounds(bounds);
                } else {
                    alert("No results found for: " + query);
                }
            });
        }

        // 장소 정보 표시 함수
        function showPlaceInfo(place) {
            const placeInfo = document.getElementById("place-info");
            placeInfo.innerHTML = `
                <h2>${place.name}</h2>
                <p><strong>Address:</strong> ${place.formatted_address || 'N/A'}</p>
                <p><strong>Rating:</strong> ${place.rating || 'N/A'}</p>
                <p>${place.types ? place.types.join(', ') : 'No additional details available.'}</p>
            `;
        }

        // Flickr 사진 검색 함수
        function fetchFlickrPhotos(query) {
            const photoContainer = document.getElementById("photo-container");
            photoContainer.innerHTML = "";

            fetch(`https://api.flickr.com/services/rest/?method=flickr.photos.search&api_key=${flickrAPIKey}&text=${query}&sort=interestingness-desc&per_page=10&format=json&nojsoncallback=1`)
                .then(response => response.json())
                .then(data => {
                    if (data.photos.photo.length > 0) {
                        data.photos.photo.forEach(photo => {
                            const photoUrl = `https://live.staticflickr.com/${photo.server}/${photo.id}_${photo.secret}_m.jpg`;
                            const imgElement = document.createElement("img");
                            imgElement.src = photoUrl;
                            imgElement.alt = query;
                            imgElement.onclick = () => window.open(photoUrl, '_blank');
                            photoContainer.appendChild(imgElement);
                        });
                    } else {
                        photoContainer.innerHTML = "<p>No photos found for this location.</p>";
                    }
                })
                .catch(error => {
                    console.error("Error fetching photos from Flickr:", error);
                    photoContainer.innerHTML = "<p>Failed to load photos.</p>";
                });
        }
    </script>

    <!-- Load Google Maps JavaScript API -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAMOYLeKUDl8biUQd35UMesSpP7ODi6v98&callback=initMap&libraries=places">
    </script>
</body>
</html>
